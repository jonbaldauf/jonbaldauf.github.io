<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f3f5f8">
<meta name="description" content="Jon Baldauf's projects: websites and code on GitHub.">
<title>Jon Baldauf · Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:only light;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5;
  --ink:#0e1a2b; --ink-2:#4a5566; --muted:#6f7b8b;
  --line:#dfe4ea; --accent:#2a78d6; --accent-soft:#dde9f9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:44px 64px;display:grid;gap:34px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(2.6rem,7vw,3.6rem);line-height:.95}
h2{font-size:1.45rem;font-weight:600}
.eyebrow{margin:0 0 6px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{margin:10px 0 0;color:var(--ink-2);max-width:60ch}
.lede a{color:var(--accent)}
section{display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* sites: the main event, as cards */
.sites{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.site a{display:grid;gap:6px;height:100%;padding:18px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s, transform .15s}
.site a:hover{border-color:var(--accent);transform:translateY(-2px)}
.site a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.site .name{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.05}
.site .desc{color:var(--ink-2);font-size:.9rem}
.site .url{margin-top:auto;padding-top:6px;font-size:.78rem;color:var(--accent);font-weight:600;overflow-wrap:anywhere}

/* code: a quiet list */
.repos{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.repo a{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:13px 16px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.repo:last-child a{border-bottom:0}
.repo a:hover{background:var(--surface-2)}
.repo a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.repo .name{font-weight:600}
.repo .meta{font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.repo .desc{grid-column:1 / -1;font-size:.86rem;color:var(--ink-2)}
.note{margin:0;font-size:.85rem;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted)}
footer a{color:inherit}
@media (max-width:520px){
  .wrap{padding-inline:14px;padding-block:28px 48px;gap:26px}
  .repo .meta{grid-column:1 / -1;text-align:left;grid-row:3}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Projects</p>
    <h1>Jon Baldauf</h1>
    <p class="lede">Websites I’ve built and code I’ve shared. More on <a id="ghLink" href="https://github.com/jonbaldauf">GitHub</a>.</p>
  </header>

  <section aria-labelledby="sitesTitle">
    <div class="head"><h2 id="sitesTitle">Sites</h2><span class="count" id="sitesCount"></span></div>
    <ul class="sites" id="sites">
      <!-- shown until GitHub answers, and kept if it can't be reached -->
      <li class="site"><a href="/road-to-26.2/"><span class="name">Road to 26.2</span><span class="desc">Tracking my training progress for the SF Marathon 2027</span><span class="url">jonbaldauf.github.io/road-to-26.2</span></a></li>
    </ul>
  </section>

  <section aria-labelledby="codeTitle" id="codeSection" hidden>
    <div class="head"><h2 id="codeTitle">Code</h2><span class="count" id="codeCount"></span></div>
    <ul class="repos" id="repos"></ul>
  </section>

  <p class="note" id="status" hidden></p>
  <footer>Lists update automatically from my GitHub repositories.</footer>
</main>

<script>
(function(){
  // Works after a username change too: the account comes from the address
  const host = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const user = host ? host[1] : 'jonbaldauf';
  const hub = (user + '.github.io').toLowerCase();
  // Repositories to leave off this page (names, any capitalisation)
  const HIDDEN = ['vex-robot', 'bike-game', 'RockPaperScissors', 'PDV-Data-Reduction-Analysis'].map(n => n.toLowerCase());
  document.getElementById('ghLink').href = 'https://github.com/' + user;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const when = iso => new Date(iso).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });

  // A site's own <title> and description read better than its repository name
  async function pageInfo(path){
    try{
      const res = await fetch(path, { cache: 'no-store' });
      if(!res.ok) return {};
      const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
      return { title: (doc.querySelector('title') || {}).textContent, desc: (doc.querySelector('meta[name="description"]') || {}).content };
    }catch(e){ return {} }
  }

  async function load(){
    let repos;
    try{
      const res = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=pushed`);
      if(!res.ok) throw 0;
      repos = (await res.json()).filter(r => !r.private && r.name.toLowerCase() !== hub && !HIDDEN.includes(r.name.toLowerCase()));
    }catch(e){
      $('status').textContent = 'Couldn’t reach GitHub just now, so the list may be incomplete. Reload to try again.';
      $('status').hidden = false;
      return;
    }

    const sites = repos.filter(r => r.has_pages);
    const infos = await Promise.all(sites.map(r => pageInfo('/' + r.name + '/')));
    $('sites').innerHTML = sites.map((r, i) => {
      const path = '/' + r.name + '/', info = infos[i];
      const name = (info.title || '').trim() || r.name, desc = r.description || info.desc || '';
      return `<li class="site"><a href="${esc(path)}"><span class="name">${esc(name)}</span>${desc ? `<span class="desc">${esc(desc)}</span>` : ''}<span class="url">${esc(location.host + path.replace(/\/$/, ''))}</span></a></li>`;
    }).join('') || $('sites').innerHTML;
    $('sitesCount').textContent = sites.length ? `${sites.length} live` : '';

    const code = repos.filter(r => !r.has_pages);
    $('repos').innerHTML = code.map(r => `<li class="repo"><a href="${esc(r.html_url)}">
        <span class="name">${esc(r.name.replace(/[-_]+/g, ' '))}</span>
        <span class="meta">${r.language ? esc(r.language) + ' · ' : ''}${when(r.pushed_at)}</span>
        ${r.description ? `<span class="desc">${esc(r.description)}</span>` : ''}
      </a></li>`).join('');
    $('codeCount').textContent = code.length ? `${code.length} repositories` : '';
    $('codeSection').hidden = !code.length;
  }
  load();
})();
</script>
</body>
</html>
